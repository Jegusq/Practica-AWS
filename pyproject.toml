[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kid-pipeline"
version = "0.1.0"
description = "Pipeline de datos de fondos: del KID al dashboard en AWS"
readme = "README.md"
requires-python = ">=3.12"
# Dependencias del pipeline por lotes (captura + extraccion + carga).
dependencies = [
    "boto3>=1.40",
    "pydantic>=2.8",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# API (se empaqueta en la Lambda; boto3 lo aporta el runtime de Lambda).
api = ["fastapi>=0.115", "mangum>=0.19"]
# Entorno de desarrollo y tests (psycopg permite probar el SQL contra un Postgres local).
dev = [
    "fastapi>=0.115",
    "mangum>=0.19",
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
    "psycopg[binary]>=3.2",
]

[project.scripts]
kid = "kid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kid.db" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "postgres: necesita un PostgreSQL (variable KID_TEST_DSN o pgserver)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
