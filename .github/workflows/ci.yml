name: CI

# Validaciones en cada PR y cada push: lint, tests (contra un PostgreSQL real), Terraform y la imagen Docker.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Lint y tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KID_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  terraform:
    name: Terraform fmt y validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "<2.0.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: terraform fmt -check -recursive infra
      - name: validate
        run: |
          for dir in infra/bootstrap infra/main; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      # Tests del stack con un provider de AWS simulado (mock_provider): no tocan AWS.
      # Necesitan el zip de la Lambda porque el codigo calcula su hash.
      - name: terraform test
        run: |
          bash scripts/build_lambda.sh
          terraform -chdir=infra/main test

  docker:
    name: La imagen de la app compila
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kid-app:ci app
